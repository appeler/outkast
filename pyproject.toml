[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "outkast"
version = "2.0.0"
description = "Look up disclosure-limited SECC surname-group composition"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Gaurav Sood", email = "gsood07@gmail.com"},
    {name = "Suriyan Laohaprapanon", email = "suriyant@gmail.com"},
]
keywords = ["caste", "demography", "india", "names", "secc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0.5",
    # 19.0.0 cannot read the shipped artifact ("Repetition level histogram
    # size mismatch" on files carrying size statistics); 18.x and 19.0.1+ can.
    "pyarrow>=18,!=19.0.0",
]


[project.urls]
Homepage = "https://github.com/appeler/outkast"
Repository = "https://github.com/appeler/outkast"
Issues = "https://github.com/appeler/outkast/issues"

[project.scripts]
outkast-secc-lookup = "outkast.secc_composition:main"

[tool.uv.build-backend]
module-name = "outkast"
module-root = "src"
source-include = ["data/secc/build_runtime_table.py"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[dependency-groups]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.16.3", "pre-commit>=4.6.2", "pyright>=1.1.390", "pydoclint>=0.5"]
test = ["pytest>=7.0", "pytest-cov>=4.0"]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "sphinx-autodoc-typehints>=1.25",
    "sphinx-copybutton>=0.5",
    "myst-parser>=2.0",
    "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
# D203/D213: the google convention the fleet standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`, which
# the standard also runs.
ignore = ["D203", "D213", "W191", "D206", "D300", "B008"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ARG", "SLF"]
"docs/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src/outkast"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.deptry]
extend_exclude = ["data", "docs"]
ignore_notebooks = true

[tool.deptry.per_rule_ignores]
DEP002 = ["pyarrow"]
